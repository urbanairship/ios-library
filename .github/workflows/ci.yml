name: CI Pull Request

on: [pull_request]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-tests-basement:
    runs-on: xcode-27-xlarge
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test
        run: make test-basement

  run-tests-core:
    runs-on: xcode-27-xlarge
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test
        run: make test-core

  run-tests-message-center:
    runs-on: xcode-27-xlarge
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test
        run: make test-message-center

  run-tests-preference-center:
    runs-on: xcode-27-xlarge
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test
        run: make test-preference-center

  run-tests-feature-flags:
    runs-on: xcode-27-xlarge
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test
        run: make test-feature-flags

  run-tests-scene-renderer:
    runs-on: xcode-27-xlarge
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test
        run: make test-scene-renderer

  run-tests-scenes:
    runs-on: xcode-27-xlarge
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test
        run: make test-scenes

  run-tests-automation:
    runs-on: xcode-27-xlarge
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test
        run: make test-automation

  run-tests-extensions:
    runs-on: xcode-27-xlarge
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test
        run: make test-service-extension

  build-airship-objectiveC:
    runs-on: xcode-27-xlarge
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build AirshipObjectiveC target
        run: make build-airship-objectiveC
        
  build-samples:
    runs-on: xcode-27-xlarge
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build samples
        run: make build-samples

  build-sdk-tvos:
    runs-on: xcode-27-xlarge
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build SDK for tvOS
        run: make build-sdk-tvos

  build-sdk-visionos:
    runs-on: xcode-27-xlarge
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build SDK for visionOS
        run: make build-sdk-visionos

  build-sdk-maccatalyst:
    runs-on: xcode-27-xlarge
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build SDK for Mac Catalyst
        run: make build-sdk-maccatalyst


