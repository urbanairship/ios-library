name: Archive DevApp (App Store)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - next
    paths:
      - 'DevApp/**'
      - '.github/workflows/archive_devapp.yml'
      - 'scripts/archive_devapp_store.sh'
      - 'scripts/export_options/**'
      - 'Makefile'
  pull_request:
    paths:
      - 'DevApp/**'
      - '.github/workflows/archive_devapp.yml'
      - 'scripts/archive_devapp_store.sh'
      - 'scripts/export_options/**'
      - 'Makefile'

env:
  BUNDLE_PATH: vendor/bundle

concurrency:
  group: archive-devapp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive-devapp:
    if: |
      github.repository == 'urbanairship/ios-library' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: xcode-27-xlarge
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache Thomas layouts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            DevApp/Dev App/Thomas/Resources/Scenes
            DevApp/Dev App/Thomas/Resources/.layouts.version
          key: thomas-layouts-${{ hashFiles('layouts.version') }}

      - name: Mint layouts read token
        id: layouts_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ vars.ACTIONS_REPO_READER_APP_ID }}
          private-key: ${{ secrets.ACTIONS_REPO_READER_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: thomas-layouts

      - name: Fetch layouts
        env:
          LAYOUTS_REPO_TOKEN: ${{ steps.layouts_token.outputs.token }}
        run: make fetch-layouts

      - name: Install Apple Certificate
        uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d # v3.0.0
        with:
          p12-file-base64: ${{ secrets.CERTIFICATEXC }}
          p12-password: ${{ secrets.CERTIFICATEXC_PASS }}

      - name: Archive, export, validate DevApp
        env:
          ASC_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: make archive-devapp-store
