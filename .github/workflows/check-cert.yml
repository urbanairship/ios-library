name: Check Certificate Expiration

on:
  workflow_dispatch:

jobs:
  check-cert:
    runs-on: macos-latest
    steps:
      - name: Check Certificate Details
        env:
          CERT_BASE64: ${{ secrets.CERTIFICATEXC }}
          CERT_PASS: ${{ secrets.CERTIFICATEXC_PASS }}
        run: |
          # Decode the certificate from base64
          echo "$CERT_BASE64" | base64 --decode > cert.p12

          # Extract certificate info without importing to keychain
          # This will show expiration date and other details
          # Use Apple's system openssl (LibreSSL-based): Homebrew's OpenSSL 3.x build lacks
          # the legacy provider needed for RC2-40-CBC, which is what Keychain Access exports use.
          /usr/bin/openssl pkcs12 -in cert.p12 -passin pass:"$CERT_PASS" -nokeys -clcerts | /usr/bin/openssl x509 -noout -subject -issuer -dates -fingerprint

          # Also show the certificate name as it appears for codesigning
          /usr/bin/openssl pkcs12 -in cert.p12 -passin pass:"$CERT_PASS" -nokeys -clcerts | /usr/bin/openssl x509 -noout -subject | sed 's/subject=//'

          # Clean up
          rm cert.p12