name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match an existing tag and AirshipConfig.xcconfig)"
        required: true
        type: string
      stage:
        description: "Which stage to run on its own"
        required: true
        type: choice
        default: create-release
        options:
          - create-release
          - attach-packages
          - kickoff-prebuilt

permissions:
  contents: read

jobs:
  check-version:
    if: github.repository == 'urbanairship/ios-library'
    # Reads a version out of a source file and diffs it against the tag - no
    # Xcode involved. On Linux so the manual stages, which all depend on this,
    # never queue behind the Mac fleet.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4
      - name: Get the version
        id: get_version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-${GITHUB_REF#refs/tags/}}"
          # Defense in depth only - the primary control is that VERSION is never
          # interpolated into a shell script body. The tag filter's trailing "**" accepts
          # arbitrary suffixes, so fail closed on anything outside the charset our real
          # tags use (20.12.0, 20.0.0-rc1, 18.0.0-beta.2, 19.9.0-swift5, 19.0.0.1).
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.-]*$'; then
            echo "::error::Refusing to release: tag is not a valid version string"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check Version
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          set -euo pipefail
          bash ./scripts/check_version.sh "$VERSION"

      - name: Slack Notification
        uses: lazy-actions/slatify@master
        with:
          type: ${{ job.status }}
          job_name: "iOS SDK Release Started :apple_og:"
          url: ${{ secrets.SLACK_WEBHOOK }}

  build-package:
    needs: check-version
    if: github.event_name == 'push' || inputs.stage == 'attach-packages'
    runs-on: xcode-27-xlarge
    steps:
      - uses: actions/checkout@v4
      - name: Install Coreutils
        run: brew install coreutils
      - name: Install Apple Certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.CERTIFICATEXC }}
          p12-password: ${{ secrets.CERTIFICATEXC_PASS }}
      - name: Check Certificate Expiry Window
        env:
          CERT_BASE64: ${{ secrets.CERTIFICATEXC }}
          CERT_PASS: ${{ secrets.CERTIFICATEXC_PASS }}
        run: |
          # Fails if the cert expires within 30 days, before we sign a release with it.
          # Use Apple's system openssl (LibreSSL-based): Homebrew's OpenSSL 3.x build lacks
          # the legacy provider needed for RC2-40-CBC, which is what Keychain Access exports use.
          echo "$CERT_BASE64" | base64 --decode > cert.p12
          /usr/bin/openssl pkcs12 -in cert.p12 -passin pass:"$CERT_PASS" -nokeys -clcerts | /usr/bin/openssl x509 -checkend 2592000
          rm cert.p12
      - name: Verify Certificate Is Not Revoked
        run: |
          # codesign --verify catches basic signature/integrity problems, but its OCSP-based
          # revocation checking has been observed to pass on a certificate Apple's own OCSP
          # responder reports as revoked (locally cached trust decisions, most likely). Query
          # the OCSP responder directly as the authoritative check.
          echo 'int main(){return 0;}' > test.c
          clang -o testbin test.c
          codesign --timestamp -v --sign "Apple Distribution: Urban Airship Inc. (PGJV57GD94)" testbin
          codesign --verify --strict -vvv testbin

          codesign -d --extract-certificates testbin
          /usr/bin/openssl x509 -inform DER -in codesign0 -outform PEM -out leaf.pem
          /usr/bin/openssl x509 -inform DER -in codesign1 -outform PEM -out issuer.pem
          /usr/bin/openssl x509 -inform DER -in codesign2 -outform PEM -out root.pem
          OCSP_URL=$(/usr/bin/openssl x509 -in leaf.pem -noout -ocsp_uri)
          OCSP_STATUS=$(/usr/bin/openssl ocsp -issuer issuer.pem -cert leaf.pem -url "$OCSP_URL" -no_nonce -text -verify_other issuer.pem -CAfile root.pem 2>&1)
          echo "$OCSP_STATUS"
          # Fail closed: require an explicit "good" response rather than just checking for
          # "revoked". A network blip or malformed query produces neither string, and treating
          # that as "not revoked" would silently skip the check entirely - the same failure
          # shape as the original incident.
          if ! echo "$OCSP_STATUS" | grep -q "Cert Status: good"; then
            echo "::error::Could not confirm certificate is not revoked via Apple OCSP responder"
            exit 1
          fi
      - name: Build SDK
        run: make build-package
      - name: Upload zip distribution
        uses: actions/upload-artifact@v4
        with:
          name: airship
          path: ./build/Airship.zip

      - name: Upload zip distribution (Carthage)
        uses: actions/upload-artifact@v4
        with:
          name: airship-carthage
          path: ./build/Airship.xcframeworks.zip

      - name: Upload .NET xcframeworks
        uses: actions/upload-artifact@v4
        with:
          name: airship-dotnet
          path: ./build/Airship.dotnet.xcframeworks.zip


  build-samples:
    needs: check-version
    if: github.event_name == 'push' || inputs.stage == 'attach-packages'
    runs-on: xcode-27-xlarge
    steps:
      - uses: actions/checkout@v4
      - name: Build samples
        run: make build-samples

  # Test jobs, all depend on check-version
  run-tests-basement:
    needs: check-version
    if: github.event_name == 'push'
    runs-on: xcode-27-xlarge
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Test Basement
        run: make test-basement

  run-tests-core:
    needs: check-version
    if: github.event_name == 'push'
    runs-on: xcode-27-xlarge
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Test Core
        run: make test-core
        
  run-tests-preference-center:
    needs: check-version
    if: github.event_name == 'push'
    runs-on: xcode-27-xlarge
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Test Preference Center
        run: make test-preference-center
        
  run-tests-message-center:
    needs: check-version
    if: github.event_name == 'push'
    runs-on: xcode-27-xlarge
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Test Message Center
        run: make test-message-center

  run-tests-scene-renderer:
    needs: check-version
    if: github.event_name == 'push'
    runs-on: xcode-27-xlarge
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Test Scene Renderer
        run: make test-scene-renderer

  run-tests-scenes:
    needs: check-version
    if: github.event_name == 'push'
    runs-on: xcode-27-xlarge
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Test Scenes
        run: make test-scenes

  run-tests-automation:
    needs: check-version
    if: github.event_name == 'push'
    runs-on: xcode-27-xlarge
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Test Automation
        run: make test-automation

  run-tests-feature-flags:
    needs: check-version
    if: github.event_name == 'push'
    runs-on: xcode-27-xlarge
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Test Feature Flags
        run: make test-feature-flags

  run-tests-service-extension:
    needs: check-version
    if: github.event_name == 'push'
    runs-on: xcode-27-xlarge
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Test Service Extension
        run: make test-service-extension

  # Stage 1 of 3. Publishes the release notes as a draft, gated on the test
  # suite but NOT on build-package: the notes are ready long before the zips
  # are, and on a release where the CI image is behind the required Xcode the
  # zips may be built by hand days later. Draft, so nothing is visible until
  # stage 2 attaches the assets and flips it live.
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs:
      - check-version
      - run-tests-basement
      - run-tests-core
      - run-tests-preference-center
      - run-tests-message-center
      - run-tests-scene-renderer
      - run-tests-scenes
      - run-tests-automation
      - run-tests-feature-flags
      - run-tests-service-extension
    if: ${{ !cancelled() && !failure() && (github.event_name == 'push' || inputs.stage == 'create-release') }}
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: bash ./scripts/release_create.sh "$VERSION"

  # Stage 2 of 3. Attaches the distribution zips to the draft and publishes it.
  # This is the Xcode- and certificate-bound stage, so it is the one to run by
  # hand (scripts/release_attach.sh) when the runner image lags the release
  # Xcode. Publishing lives here so a release never goes live without assets.
  attach-packages:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs:
      - check-version
      - create-release
      - build-package
      - build-samples
    if: ${{ !cancelled() && !failure() && (github.event_name == 'push' || inputs.stage == 'attach-packages') }}
    steps:
      - uses: actions/checkout@v4
      - name: Download zip distribution
        uses: actions/download-artifact@v4
        with:
          name: airship
          path: ./build
      - name: Download Carthage zip distribution
        uses: actions/download-artifact@v4
        with:
          name: airship-carthage
          path: ./build
      - name: Download .NET xcframeworks
        uses: actions/download-artifact@v4
        with:
          name: airship-dotnet
          path: ./build
      - name: Attach packages and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: bash ./scripts/release_attach.sh "$VERSION" --skip-build

  # Stage 3 of 3. The prebuilt repo builds its own binaries, so this is just the
  # trigger — separated so it can be re-fired without redoing stages 1 and 2.
  kickoff-prebuilt:
    runs-on: ubuntu-latest
    needs:
      - check-version
      - attach-packages
    if: ${{ !cancelled() && !failure() && (github.event_name == 'push' || inputs.stage == 'kickoff-prebuilt') }}
    steps:
      - uses: actions/checkout@v4
      - name: Kickoff prebuilt repo
        env:
          GITHUB_TOKEN: ${{ secrets.IOS_DEPLOY_PREBUILT_PAT }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: bash ./scripts/release_prebuilt.sh "$VERSION"

  finished:
    runs-on: ubuntu-latest
    needs: [kickoff-prebuilt]
    if: ${{ !cancelled() && github.event_name == 'push' }}
    steps:
      - name: Slack Notification
        uses: lazy-actions/slatify@master
        if: always()
        with:
          type: ${{ job.status }}
          job_name: ":raised_hands: iOS SDK Released! :raised_hands:"
          url: ${{ secrets.SLACK_WEBHOOK }}
