name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+**"

permissions:
  contents: read

jobs:
  check-version:
    if: github.repository == 'urbanairship/ios-library'
    runs-on: macos-26-xlarge
    steps:
      - uses: actions/checkout@v4
      - name: Get the version
        id: get_version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Check Version
        run: |
          set -euo pipefail
          bash ./scripts/check_version.sh "${{ steps.get_version.outputs.VERSION }}"

      - name: Slack Notification
        uses: lazy-actions/slatify@master
        with:
          type: ${{ job.status }}
          job_name: "iOS SDK Release Started :apple_og:"
          url: ${{ secrets.SLACK_WEBHOOK }}

  build-package:
    needs: check-version
    runs-on: macos-26-xlarge
    steps:
      - uses: actions/checkout@v4
      - name: Install Coreutils
        run: brew install coreutils
      - name: Install Apple Certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.CERTIFICATEXC }}
          p12-password: ${{ secrets.CERTIFICATEXC_PASS }}
      - name: Check Certificate Expiry Window
        env:
          CERT_BASE64: ${{ secrets.CERTIFICATEXC }}
          CERT_PASS: ${{ secrets.CERTIFICATEXC_PASS }}
        run: |
          # Fails if the cert expires within 30 days, before we sign a release with it.
          # Use Apple's system openssl (LibreSSL-based): Homebrew's OpenSSL 3.x build lacks
          # the legacy provider needed for RC2-40-CBC, which is what Keychain Access exports use.
          echo "$CERT_BASE64" | base64 --decode > cert.p12
          /usr/bin/openssl pkcs12 -in cert.p12 -passin pass:"$CERT_PASS" -nokeys -clcerts | /usr/bin/openssl x509 -checkend 2592000
          rm cert.p12
      - name: Verify Certificate Is Not Revoked
        run: |
          # codesign --verify catches basic signature/integrity problems, but its OCSP-based
          # revocation checking has been observed to pass on a certificate Apple's own OCSP
          # responder reports as revoked (locally cached trust decisions, most likely). Query
          # the OCSP responder directly as the authoritative check.
          echo 'int main(){return 0;}' > test.c
          clang -o testbin test.c
          codesign --timestamp -v --sign "Apple Distribution: Urban Airship Inc. (PGJV57GD94)" testbin
          codesign --verify --strict -vvv testbin

          codesign -d --extract-certificates testbin
          /usr/bin/openssl x509 -inform DER -in codesign0 -outform PEM -out leaf.pem
          /usr/bin/openssl x509 -inform DER -in codesign1 -outform PEM -out issuer.pem
          /usr/bin/openssl x509 -inform DER -in codesign2 -outform PEM -out root.pem
          OCSP_URL=$(/usr/bin/openssl x509 -in leaf.pem -noout -ocsp_uri)
          OCSP_STATUS=$(/usr/bin/openssl ocsp -issuer issuer.pem -cert leaf.pem -url "$OCSP_URL" -no_nonce -text -verify_other issuer.pem -CAfile root.pem 2>&1)
          echo "$OCSP_STATUS"
          # Fail closed: require an explicit "good" response rather than just checking for
          # "revoked". A network blip or malformed query produces neither string, and treating
          # that as "not revoked" would silently skip the check entirely - the same failure
          # shape as the original incident.
          if ! echo "$OCSP_STATUS" | grep -q "Cert Status: good"; then
            echo "::error::Could not confirm certificate is not revoked via Apple OCSP responder"
            exit 1
          fi
      - name: Build SDK
        run: make build-package
      - name: Upload zip distribution
        uses: actions/upload-artifact@v4
        with:
          name: airship
          path: ./build/Airship.zip

      - name: Upload zip distribution (Carthage)
        uses: actions/upload-artifact@v4
        with:
          name: airship-carthage
          path: ./build/Airship.xcframeworks.zip

      - name: Upload .NET xcframeworks
        uses: actions/upload-artifact@v4
        with:
          name: airship-dotnet
          path: ./build/Airship.dotnet.xcframeworks.zip


  build-samples:
    needs: check-version
    runs-on: macos-26-xlarge
    steps:
      - uses: actions/checkout@v4
      - name: Build samples
        run: make build-samples

  # Test jobs, all depend on check-version
  run-tests-basement:
    needs: check-version
    runs-on: macos-26-xlarge
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Test Basement
        run: make test-basement

  run-tests-core:
    needs: check-version
    runs-on: macos-26-xlarge
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Test Core
        run: make test-core
        
  run-tests-preference-center:
    needs: check-version
    runs-on: macos-26-xlarge
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Test Preference Center
        run: make test-preference-center
        
  run-tests-message-center:
    needs: check-version
    runs-on: macos-26-xlarge
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Test Message Center
        run: make test-message-center

  run-tests-scene-renderer:
    needs: check-version
    runs-on: macos-26-xlarge
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Test Scene Renderer
        run: make test-scene-renderer

  run-tests-scenes:
    needs: check-version
    runs-on: macos-26-xlarge
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Test Scenes
        run: make test-scenes

  run-tests-automation:
    needs: check-version
    runs-on: macos-26-xlarge
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Test Automation
        run: make test-automation

  run-tests-feature-flags:
    needs: check-version
    runs-on: macos-26-xlarge
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Test Feature Flags
        run: make test-feature-flags

  run-tests-service-extension:
    needs: check-version
    runs-on: macos-26-xlarge
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Test Service Extension
        run: make test-service-extension

  deploy-github:
    permissions:
      contents: write
    runs-on: macos-26-xlarge
    needs:
      - run-tests-basement
      - run-tests-core
      - run-tests-preference-center
      - run-tests-message-center
      - run-tests-scene-renderer
      - run-tests-scenes
      - run-tests-automation
      - run-tests-feature-flags
      - run-tests-service-extension
      - build-package
      - build-samples
    steps:
      - uses: actions/checkout@v4
      - name: Get the version
        id: get_version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Get the release notes
        id: get_release_notes
        run: |
          set -euo pipefail
          
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          
          # Match line starting with '## Version [VERSION]' 
          # but allow for the date suffix that follows.
          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "^## Version " ver "($|[ ]-)" {flag=1; next} 
            $0 ~ "^## Version " {flag=0} 
            flag
          ' CHANGELOG.md)

          # Strip potential leading/trailing whitespace/newlines
          NOTES="$(echo "$NOTES" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

          if [ -z "$NOTES" ]; then
            echo "::error::Could not find notes for Version $VERSION in CHANGELOG.md"
            exit 1
          fi

          DELIMITER="EOF_$(uuidgen)"
          {
            echo "NOTES<<$DELIMITER"
            echo "$NOTES"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Download zip distribution
        uses: actions/download-artifact@v4
        with:
          name: airship
          path: ./build
      - name: Download Carthage zip distribution
        uses: actions/download-artifact@v4
        with:
          name: airship-carthage
          path: ./build

      - name: Download .NET xcframeworks
        uses: actions/download-artifact@v4
        with:
          name: airship-dotnet
          path: ./build

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          release_name: ${{ steps.get_version.outputs.VERSION }}
          body: ${{ steps.get_release_notes.outputs.NOTES }}
          draft: false
          prerelease: false
          files: |
            ./build/Airship.zip
            ./build/Airship.xcframeworks.zip
            ./build/Airship.dotnet.xcframeworks.zip
      - name: Kickoff prebuilt repo
        env:
          GITHUB_TOKEN: ${{ secrets.IOS_DEPLOY_PREBUILT_PAT }}
        run: gh --repo urbanairship/ios-library-prebuilt workflow run release.yml

  finished:
    runs-on: ubuntu-latest
    needs: [deploy-github]
    steps:
      - name: Get the version
        id: get_version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Slack Notification
        uses: lazy-actions/slatify@master
        if: always()
        with:
          type: ${{ job.status }}
          job_name: ":raised_hands: iOS SDK Released! :raised_hands:"
          url: ${{ secrets.SLACK_WEBHOOK }}
