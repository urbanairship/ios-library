name: CI Merge

on:
    push:
      branches:
        - main
        - next

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sdk:
    runs-on: xcode-27-xlarge
    steps:
      - name: Install Apple Certificate
        uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d # v3.0.0
        with:
          p12-file-base64: ${{ secrets.CERTIFICATEXC }}
          p12-password: ${{ secrets.CERTIFICATEXC_PASS }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build SDK
        run: make build-xcframeworks-no-sign

  finished:
    runs-on: ubuntu-latest
    needs: [build-sdk]
    steps:
      - name: Slack Notification
        uses: lazy-actions/slatify@cd4b4a1158cfb3e26fe1ee35c1cd4f0247dfbf96 # master
        if: ${{ failure() }}
        with:
          type: ${{ job.status }}
          job_name: "Merge things busted!"
          url: ${{ secrets.SLACK_WEBHOOK }}