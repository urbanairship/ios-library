version: 1
presentation:
  type: banner
  default_placement:
    position:
      horizontal: center
      vertical: bottom
    animation:
      type: slide
      animate_in_seconds: 0.3
      animate_out_seconds: 0.3
    ignore_safe_area: true  # Allow banner to extend beyond safe areas
    size:
      width: 100%
      height: auto
    margin:
      top: 32
      bottom: 0
      start: 40
      end: 16
    border:
      border_radius: 24
      stroke_width: 10
      stroke_color:
        default:
          hex: "#00FF00"
          alpha: 1
    background_color:
      default:
        hex: "#FFFFFF"
        alpha: 1
  duration_seconds: 8
