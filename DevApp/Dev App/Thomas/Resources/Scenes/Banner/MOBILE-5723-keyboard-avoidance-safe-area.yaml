# #181 (kept): ios.keyboard_avoidance on the banner presentation
version: 1
presentation:
  type: banner
  default_placement:
    position:
      horizontal: center
      vertical: bottom
    animation:
      type: slide
      animate_in_seconds: 0.3
      animate_out_seconds: 0.3
    size:
      width: 100%
      height: auto
    margin:
      top: 12
      bottom: 12
      start: 12
      end: 12
    background_color:
      default:
        type: hex
        hex: '#FFFFFF'
        alpha: 1
    border:
      radius: 12
    swipe_to_dismiss: true
  ios:
    keyboard_avoidance: safe_area
view:
  type: form_controller
  identifier: mobile-5723_keyboard_form
  submit: submit_event
  view:
    type: linear_layout
    direction: vertical
    items:
    - size:
        width: 100%
        height: auto
      view:
        type: label
        text: 'MOBILE-5723 keyboard_avoidance: safe_area'
        text_appearance:
          font_size: 15
          alignment: center
          color:
            default:
              type: hex
              hex: '#1A1A2E'
              alpha: 1
          styles:
          - bold
      margin:
        top: 12
        start: 16
        end: 16
    - size:
        width: 100%
        height: auto
      view:
        type: label
        text: 'Focus the input: the banner should move with the keyboard. Change safe_area to over_the_top
          to test the other mode.'
        text_appearance:
          font_size: 13
          alignment: center
          color:
            default:
              type: hex
              hex: '#44475A'
              alpha: 1
      margin:
        top: 4
        start: 16
        end: 16
    - size:
        width: 100%
        height: 44
      view:
        type: text_input
        identifier: mobile-5723_keyboard_input
        input_type: text
        required: false
        background_color:
          default:
            type: hex
            hex: '#EAE9E9'
            alpha: 1
        border:
          radius: 4
          stroke_width: 1
          stroke_color:
            default:
              type: hex
              hex: '#63656B'
              alpha: 1
        text_appearance:
          font_size: 14
          alignment: start
          color:
            default:
              type: hex
              hex: '#000000'
              alpha: 1
      margin:
        top: 8
        start: 16
        end: 16
    - size:
        width: 50%
        height: auto
      view:
        type: label_button
        identifier: banner_dismiss
        background_color:
          default:
            type: hex
            hex: '#3E8E6E'
            alpha: 1
        border:
          radius: 8
        button_click:
        - dismiss
        label:
          type: label
          text: Dismiss
          text_appearance:
            font_size: 14
            alignment: center
            color:
              default:
                type: hex
                hex: '#FFFFFF'
                alpha: 1
      margin:
        top: 10
        bottom: 12
        start: 16
        end: 16
