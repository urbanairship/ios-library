# #318: placement shadow via selectors (box_shadow + android_shadow)
version: 1
presentation:
  type: banner
  default_placement:
    position:
      horizontal: center
      vertical: bottom
    animation:
      type: slide
      animate_in_seconds: 0.3
      animate_out_seconds: 0.3
    size:
      width: 100%
      height: auto
    margin:
      top: 12
      bottom: 12
      start: 12
      end: 12
    background_color:
      default:
        type: hex
        hex: '#FFFFFF'
        alpha: 1
    border:
      radius: 12
    swipe_to_dismiss: true
    shadow:
      selectors:
      - shadow:
          box_shadow:
            color:
              default:
                type: hex
                hex: '#000000'
                alpha: 0.4
            radius: 12
            blur_radius: 16
            offset_y: 6
          android_shadow:
            color:
              default:
                type: hex
                hex: '#000000'
                alpha: 0.4
            elevation: 12
  duration_seconds: 15
view:
  type: linear_layout
  direction: vertical
  items:
  - size:
      width: 100%
      height: auto
    view:
      type: label
      text: MOBILE-5723 shadow
      text_appearance:
        font_size: 15
        alignment: center
        color:
          default:
            type: hex
            hex: '#1A1A2E'
            alpha: 1
        styles:
        - bold
    margin:
      top: 12
      start: 16
      end: 16
  - size:
      width: 100%
      height: auto
    view:
      type: label
      text: box_shadow (iOS/web) + android_shadow elevation.
      text_appearance:
        font_size: 13
        alignment: center
        color:
          default:
            type: hex
            hex: '#44475A'
            alpha: 1
    margin:
      top: 4
      start: 16
      end: 16
  - size:
      width: 50%
      height: auto
    view:
      type: label_button
      identifier: banner_dismiss
      background_color:
        default:
          type: hex
          hex: '#2E6ED0'
          alpha: 1
      border:
        radius: 8
      button_click:
      - dismiss
      label:
        type: label
        text: Dismiss
        text_appearance:
          font_size: 14
          alignment: center
          color:
            default:
              type: hex
              hex: '#FFFFFF'
              alpha: 1
    margin:
      top: 10
      bottom: 12
      start: 16
      end: 16
