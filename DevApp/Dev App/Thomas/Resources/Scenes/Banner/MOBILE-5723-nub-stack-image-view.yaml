# #318: nub as authored stack_image_view content (replaces the old placement nub field)
version: 1
presentation:
  type: banner
  default_placement:
    position:
      horizontal: center
      vertical: bottom
    animation:
      type: slide
      animate_in_seconds: 0.3
      animate_out_seconds: 0.3
    size:
      width: 100%
      height: auto
    margin:
      top: 12
      bottom: 12
      start: 12
      end: 12
    background_color:
      default:
        type: hex
        hex: '#FFFFFF'
        alpha: 1
    border:
      radius: 12
    swipe_to_dismiss: true
view:
  type: linear_layout
  direction: vertical
  items:
  - size:
      width: 36
      height: 5
    view:
      type: stack_image_view
      identifier: banner_nub
      items:
      - type: shape
        shape:
          type: rectangle
          aspect_ratio: 7.2
          scale: 1
          color:
            default:
              type: hex
              hex: '#B0B3C1'
              alpha: 1
          border:
            radius: 3
    margin:
      top: 8
  - size:
      width: 100%
      height: auto
    view:
      type: label
      text: MOBILE-5723 stack_image_view nub
      text_appearance:
        font_size: 15
        alignment: center
        color:
          default:
            type: hex
            hex: '#1A1A2E'
            alpha: 1
        styles:
        - bold
    margin:
      top: 12
      start: 16
      end: 16
  - size:
      width: 100%
      height: auto
    view:
      type: label
      text: The grab handle above is authored content (stack_image_view), not a placement nub. No red
        placeholder should ever appear.
      text_appearance:
        font_size: 13
        alignment: center
        color:
          default:
            type: hex
            hex: '#44475A'
            alpha: 1
    margin:
      top: 4
      start: 16
      end: 16
  - size:
      width: 50%
      height: auto
    view:
      type: label_button
      identifier: banner_dismiss
      background_color:
        default:
          type: hex
          hex: '#D08A2E'
          alpha: 1
      border:
        radius: 8
      button_click:
      - dismiss
      label:
        type: label
        text: Dismiss
        text_appearance:
          font_size: 14
          alignment: center
          color:
            default:
              type: hex
              hex: '#FFFFFF'
              alpha: 1
    margin:
      top: 10
      bottom: 12
      start: 16
      end: 16
