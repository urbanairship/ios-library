# #318: side-edge placement (vertical center + end) with slide animation
version: 1
presentation:
  type: banner
  default_placement:
    position:
      horizontal: end
      vertical: center
    animation:
      type: slide
      animate_in_seconds: 0.3
      animate_out_seconds: 0.3
    size:
      width: 45%
      height: auto
    margin:
      top: 12
      bottom: 12
      start: 12
      end: 12
    background_color:
      default:
        type: hex
        hex: '#FFFFFF'
        alpha: 1
    border:
      radius: 12
    swipe_to_dismiss: true
  duration_seconds: 10
view:
  type: linear_layout
  direction: vertical
  items:
  - size:
      width: 100%
      height: auto
    view:
      type: label
      text: 'MOBILE-5723 edge: center-end'
      text_appearance:
        font_size: 15
        alignment: center
        color:
          default:
            type: hex
            hex: '#1A1A2E'
            alpha: 1
        styles:
        - bold
    margin:
      top: 12
      start: 16
      end: 16
  - size:
      width: 100%
      height: auto
    view:
      type: label
      text: Side-edge banner. Slides from the end edge.
      text_appearance:
        font_size: 13
        alignment: center
        color:
          default:
            type: hex
            hex: '#44475A'
            alpha: 1
    margin:
      top: 4
      start: 16
      end: 16
  - size:
      width: 50%
      height: auto
    view:
      type: label_button
      identifier: banner_dismiss
      background_color:
        default:
          type: hex
          hex: '#3E8E6E'
          alpha: 1
      border:
        radius: 8
      button_click:
      - dismiss
      label:
        type: label
        text: Dismiss
        text_appearance:
          font_size: 14
          alignment: center
          color:
            default:
              type: hex
              hex: '#FFFFFF'
              alpha: 1
    margin:
      top: 10
      bottom: 12
      start: 16
      end: 16
