---
version: 1
presentation:
  type: embedded
  embedded_id: "selectors fixed swap"
  default_placement:
    size:
      width: 50%
      height: 50%
  placement_selectors:
  - orientation: landscape
    placement:
      size:
        width: 100%
        height: 120
view:
  type: container
  border:
    stroke_color:
      default:
        hex: "#FF0D49"
        alpha: 1
    stroke_width: 2
  background_color:
    default:
      hex: "#2A9D8F"
      alpha: 1
  items:
  - position:
      horizontal: center
      vertical: center
    margin:
      top: 16
      bottom: 16
      start: 16
      end: 16
    size:
      width: 100%
      height: auto
    view:
      type: label
      text: "Portrait/tall: 50% x 50%. Landscape/wide: 100% x 120pt. Should swap instantly, never blank or collapse."
      text_appearance:
        font_size: 14
        color:
          default:
            hex: "#FFFFFF"
            alpha: 1
