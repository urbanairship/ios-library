---
version: 1
presentation:
  type: embedded
  embedded_id: "pager 100pct x 200pt"
  default_placement:
    size:
      width: 100%
      height: 200
view:
  type: pager_controller
  identifier: pager-resize-controller
  view:
    type: container
    border:
      stroke_color:
        default:
          hex: "#FF0D49"
          alpha: 1
      stroke_width: 2
    items:
    - position:
        horizontal: center
        vertical: center
      size:
        width: 100%
        height: 100%
      view:
        type: pager
        items:
        - identifier: page-1
          type: pager_item
          view:
            type: container
            background_color:
              default:
                hex: "#E63946"
                alpha: 1
            items:
            - position:
                horizontal: center
                vertical: center
              size:
                width: auto
                height: auto
              view:
                type: label
                text: "1"
                text_appearance:
                  font_size: 64
                  color:
                    default:
                      hex: "#FFFFFF"
                      alpha: 1
        - identifier: page-2
          type: pager_item
          view:
            type: container
            background_color:
              default:
                hex: "#457B9D"
                alpha: 1
            items:
            - position:
                horizontal: center
                vertical: center
              size:
                width: auto
                height: auto
              view:
                type: label
                text: "2"
                text_appearance:
                  font_size: 64
                  color:
                    default:
                      hex: "#FFFFFF"
                      alpha: 1
        - identifier: page-3
          type: pager_item
          view:
            type: container
            background_color:
              default:
                hex: "#2A9D8F"
                alpha: 1
            items:
            - position:
                horizontal: center
                vertical: center
              size:
                width: auto
                height: auto
              view:
                type: label
                text: "3"
                text_appearance:
                  font_size: 64
                  color:
                    default:
                      hex: "#FFFFFF"
                      alpha: 1
        - identifier: page-4
          type: pager_item
          view:
            type: container
            background_color:
              default:
                hex: "#E9C46A"
                alpha: 1
            items:
            - position:
                horizontal: center
                vertical: center
              size:
                width: auto
                height: auto
              view:
                type: label
                text: "4"
                text_appearance:
                  font_size: 64
                  color:
                    default:
                      hex: "#000000"
                      alpha: 1
        - identifier: page-5
          type: pager_item
          view:
            type: container
            background_color:
              default:
                hex: "#6D597A"
                alpha: 1
            items:
            - position:
                horizontal: center
                vertical: center
              size:
                width: auto
                height: auto
              view:
                type: label
                text: "5"
                text_appearance:
                  font_size: 64
                  color:
                    default:
                      hex: "#FFFFFF"
                      alpha: 1
    - position:
        horizontal: center
        vertical: bottom
      margin:
        bottom: 8
      size:
        width: 100%
        height: 12
      view:
        type: pager_indicator
        spacing: 4
        bindings:
          selected:
            shapes:
            - type: ellipse
              aspect_ratio: 1
              scale: 1
              color:
                default:
                  hex: "#FFFFFF"
                  alpha: 1
          unselected:
            shapes:
            - type: ellipse
              aspect_ratio: 1
              scale: 1
              color:
                default:
                  hex: "#FFFFFF"
                  alpha: 0.4
