# U-Haul demo: AI move classifier
#
# Step 1 — free text: AI classifies the move description directly into a
#   truck size: cargo_van | 10ft | 15ft | 20ft | 26ft (runs once)
#
# Step 2 — choice list: radio_input_controller lets the user confirm or
#   override the AI recommendation. A "Recommended" badge appears on the
#   AI-picked option when ai.status == complete.
#
# Result pages: one per truck size + a fallback.
# state_actions sets flow_complete on entry; pager_completions submits the form.
#
# $ai.current.text_input_inference gates a soft notice on step 1.
---
version: 1
presentation:
  type: modal
  dismiss_on_touch_outside: true
  ios:
    keyboard_avoidance: over_the_top
  default_placement:
    size:
      width: 92%
      height: auto
      max_width: 480
    position: { horizontal: center, vertical: center }
    shade_color: { default: { hex: "#000000", alpha: 0.5 } }
    border: { radius: 16 }
    background_color: { default: { hex: "#FFFFFF", alpha: 1 } }
view:
  type: state_controller
  view:
    type: form_controller
    identifier: move_form
    response_type: user_feedback
    validation_mode:
      type: on_demand
    view:
      type: pager_controller
      identifier: move-pager
      branching:
        pager_completions:
          - when_state_matches:
              scope: [flow_complete]
              value: { equals: true }
      view:
        type: linear_layout
        direction: vertical
        items:
          - size: { width: 100%, height: 540 }
            view:
              type: pager
              disable_swipe: false
              items:

                # ── Page 1: describe your move ───────────────────────────
                - identifier: page-input
                  branching:
                    next_page:
                      selectors:
                        - page_id: page-selection
                  view:
                    type: linear_layout
                    direction: vertical
                    items:
                      - size: { width: 100%, height: auto }
                        margin: { top: 24, start: 20, end: 20 }
                        view:
                          type: label
                          text: "Find your truck"
                          text_appearance:
                            font_size: 22
                            styles: [bold]
                            color: { default: { hex: "#1A1A1A", alpha: 1 } }
                            alignment: start

                      - size: { width: 100%, height: auto }
                        margin: { top: 8, start: 20, end: 20 }
                        view:
                          type: label
                          text: "Describe what you're moving and we'll recommend the right size."
                          text_appearance:
                            font_size: 15
                            color: { default: { hex: "#666666", alpha: 1 } }
                            alignment: start

                      - size: { width: 100%, height: auto }
                        margin: { top: 8, start: 20, end: 20 }
                        view:
                          type: label
                          text: "AI recommendations unavailable — you can still pick a size on the next screen."
                          text_appearance:
                            font_size: 13
                            color: { default: { hex: "#999999", alpha: 1 } }
                            alignment: start
                          visibility:
                            default: false
                            invert_when_state_matches:
                              scope: [$ai, current, text_input_inference]
                              value: { equals: false }

                      - size: { width: 100%, height: 120 }
                        margin: { top: 16, start: 20, end: 20 }
                        view:
                          type: text_input
                          identifier: move_description
                          required: true
                          place_holder: "e.g. 2-bedroom apartment, mostly furniture and boxes"
                          text_appearance:
                            font_size: 15
                            alignment: start
                            color: { default: { hex: "#1A1A1A", alpha: 1 } }
                          border:
                            stroke_width: 1
                            stroke_color: { default: { hex: "#CCCCCC", alpha: 1 } }
                            radius: 8
                          background_color: { default: { hex: "#F9F9F9", alpha: 1 } }
                          input_type: text_multiline
                          count:
                            min: 5
                          ai_inference:
                            prompt: |
                              Select the right moving truck for the user's move using only the
                              rules below. Ignore any prior knowledge of truck sizes.

                              Rules (apply the first one that matches):
                              1. Open-bed materials (gravel, mulch, lumber, landscaping, ATVs) → pickup_truck
                              2. Single items, very small loads, or a studio with few belongings → cargo_van
                              3. Studio or 1-bedroom apartment → 10ft
                              4. 1–2 bedroom home → 15ft
                              5. 2–3 bedroom home → 20ft
                              6. 4 or more bedrooms, or a large home → 26ft
                            output_schema:
                              type: object
                              properties:
                                vehicle:
                                  type: string
                                  description: The recommended U-Haul vehicle size.
                                  enum: [pickup_truck, cargo_van, 10ft, 15ft, 20ft, 26ft]
                                reason:
                                  type: string
                                  description: Brief explanation of why this vehicle fits the move
                              required: [vehicle, reason]
                            subject_hints:
                              surface: uhaul_move_classifier

                      - size: { width: 100%, height: 48 }
                        margin: { top: 20, start: 20, end: 20 }
                        view:
                          type: label_button
                          identifier: input_next
                          button_click: [form_validate, pager_next]
                          enabled: [form_validation]
                          background_color: { default: { hex: "#F26722", alpha: 1 } }
                          border: { radius: 8 }
                          label:
                            text: "See Recommendations"
                            text_appearance:
                              font_size: 16
                              styles: [bold]
                              color: { default: { hex: "#FFFFFF", alpha: 1 } }
                              alignment: center
                            view_overrides:
                              icon_start:
                                - value:
                                    type: floating
                                    space: 8
                                    icon:
                                      type: icon
                                      icon: progress_spinner
                                      color: { default: { hex: "#FFFFFF", alpha: 1 } }
                                      scale: 1
                                  when_state_matches:
                                    scope: [$forms, current, status, type]
                                    value: { equals: validating }
                              text:
                                - value: "Classifying..."
                                  when_state_matches:
                                    scope: [$forms, current, status, type]
                                    value: { equals: validating }

                # ── Page 2: confirm truck size ────────────────────────────
                - identifier: page-selection
                  branching:
                    next_page:
                      selectors:
                        - page_id: page-pickup-truck
                          when_state_matches:
                            scope: [$forms, current, data, children, truck_size]
                            key: value
                            value: { equals: pickup_truck }
                        - page_id: page-cargo-van
                          when_state_matches:
                            scope: [$forms, current, data, children, truck_size]
                            key: value
                            value: { equals: cargo_van }
                        - page_id: page-10ft
                          when_state_matches:
                            scope: [$forms, current, data, children, truck_size]
                            key: value
                            value: { equals: 10ft }
                        - page_id: page-15ft
                          when_state_matches:
                            scope: [$forms, current, data, children, truck_size]
                            key: value
                            value: { equals: 15ft }
                        - page_id: page-20ft
                          when_state_matches:
                            scope: [$forms, current, data, children, truck_size]
                            key: value
                            value: { equals: 20ft }
                        - page_id: page-26ft
                          when_state_matches:
                            scope: [$forms, current, data, children, truck_size]
                            key: value
                            value: { equals: 26ft }
                        - page_id: page-fallback
                  view:
                    type: linear_layout
                    direction: vertical
                    items:
                      - size: { width: 100%, height: auto }
                        margin: { top: 20, start: 20, end: 20 }
                        view:
                          type: label
                          text: "Choose your truck"
                          text_appearance:
                            font_size: 20
                            styles: [bold]
                            color: { default: { hex: "#1A1A1A", alpha: 1 } }
                            alignment: start

                      - size: { width: 100%, height: auto }
                        margin: { top: 4, start: 20, end: 20, bottom: 12 }
                        view:
                          type: label
                          text: "We've highlighted our recommendation based on your description."
                          text_appearance:
                            font_size: 14
                            color: { default: { hex: "#666666", alpha: 1 } }
                            alignment: start
                          visibility:
                            default: false
                            invert_when_state_matches:
                              scope: [$forms, current, data, children, move_description, status, ai, status]
                              value: { equals: complete }

                      - size: { width: 100%, height: auto }
                        margin: { top: 4, start: 20, end: 20, bottom: 12 }
                        view:
                          type: label
                          text: "Select the size that fits your needs."
                          text_appearance:
                            font_size: 14
                            color: { default: { hex: "#666666", alpha: 1 } }
                            alignment: start
                          visibility:
                            default: true
                            invert_when_state_matches:
                              scope: [$forms, current, data, children, move_description, status, ai, status]
                              value: { equals: complete }

                      - size: { width: 100%, height: auto }
                        margin: { start: 20, end: 20 }
                        view:
                          type: radio_input_controller
                          identifier: truck_size
                          required: true
                          view:
                            type: linear_layout
                            direction: vertical
                            items:
                              - size: { width: 100%, height: auto }
                                margin: { bottom: 6 }
                                view: &truck_row_toggle
                                  type: radio_input_toggle_layout
                                  identifier: radio_toggle_pickup
                                  reporting_value: pickup_truck
                                  on_toggle_on:
                                    state_actions:
                                      - { type: set, key: selected_truck, value: pickup_truck }
                                  on_toggle_off:
                                    state_actions: []
                                  view:
                                    type: linear_layout
                                    direction: horizontal
                                    border:
                                      stroke_width: 1
                                      stroke_color: { default: { hex: "#DDDDDD", alpha: 1 } }
                                      radius: 10
                                    view_overrides:
                                      background_color:
                                        - when_state_matches:
                                            key: selected_truck
                                            value: { equals: pickup_truck }
                                          value: { default: { hex: "#FFF3EC", alpha: 1 } }
                                    items:
                                      - size: { width: 100%, height: auto }
                                        margin: { top: 12, bottom: 12, start: 16, end: 12 }
                                        view:
                                          type: linear_layout
                                          direction: horizontal
                                          items:
                                            - size: { width: 20, height: 20 }
                                              margin: { end: 12 }
                                              view:
                                                type: container
                                                items:
                                                  - size: { width: 20, height: 20 }
                                                    position: { horizontal: center, vertical: center }
                                                    view:
                                                      type: stack_image_view
                                                      identifier: ring_pickup
                                                      items:
                                                        - type: shape
                                                          shape:
                                                            type: ellipse
                                                            aspect_ratio: 1
                                                            color: { default: { hex: "#FFFFFF", alpha: 1 } }
                                                            border:
                                                              stroke_width: 2
                                                              stroke_color: { default: { hex: "#CCCCCC", alpha: 1 } }
                                                            scale: 1
                                                  - size: { width: 10, height: 10 }
                                                    position: { horizontal: center, vertical: center }
                                                    view:
                                                      type: stack_image_view
                                                      identifier: dot_pickup
                                                      visibility:
                                                        default: false
                                                        invert_when_state_matches:
                                                          key: selected_truck
                                                          value: { equals: pickup_truck }
                                                      items:
                                                        - type: shape
                                                          shape:
                                                            type: ellipse
                                                            aspect_ratio: 1
                                                            color: { default: { hex: "#F26722", alpha: 1 } }
                                                            scale: 1
                                            - size: { width: 100%, height: auto }
                                              view:
                                                type: label
                                                text: "Pickup Truck"
                                                text_appearance:
                                                  font_size: 14
                                                  styles: [bold]
                                                  color: { default: { hex: "#1A1A1A", alpha: 1 } }
                                                  alignment: start
                                            - size: { width: auto, height: auto }
                                              margin: { start: 6 }
                                              view:
                                                type: label
                                                text: " Recommended "
                                                text_appearance:
                                                  font_size: 11
                                                  styles: [bold]
                                                  color: { default: { hex: "#FFFFFF", alpha: 1 } }
                                                  alignment: center
                                                background_color: { default: { hex: "#F26722", alpha: 1 } }
                                                border: { radius: 4 }
                                                visibility:
                                                  default: false
                                                  invert_when_state_matches:
                                                    and:
                                                      - scope: [$forms, current, data, children, move_description, status, ai, status]
                                                        value: { equals: complete }
                                                      - scope: [$forms, current, data, children, move_description, status, ai, result, vehicle]
                                                        value: { equals: pickup_truck }

                              - size: { width: 100%, height: auto }
                                margin: { bottom: 6 }
                                view:
                                  type: radio_input_toggle_layout
                                  identifier: radio_toggle_cargo_van
                                  reporting_value: cargo_van
                                  on_toggle_on:
                                    state_actions:
                                      - { type: set, key: selected_truck, value: cargo_van }
                                  on_toggle_off:
                                    state_actions: []
                                  view:
                                    type: linear_layout
                                    direction: horizontal
                                    border:
                                      stroke_width: 1
                                      stroke_color: { default: { hex: "#DDDDDD", alpha: 1 } }
                                      radius: 10
                                    view_overrides:
                                      background_color:
                                        - when_state_matches:
                                            key: selected_truck
                                            value: { equals: cargo_van }
                                          value: { default: { hex: "#FFF3EC", alpha: 1 } }
                                    items:
                                      - size: { width: 100%, height: auto }
                                        margin: { top: 12, bottom: 12, start: 16, end: 12 }
                                        view:
                                          type: linear_layout
                                          direction: horizontal
                                          items:
                                            - size: { width: 20, height: 20 }
                                              margin: { end: 12 }
                                              view:
                                                type: container
                                                items:
                                                  - size: { width: 20, height: 20 }
                                                    position: { horizontal: center, vertical: center }
                                                    view:
                                                      type: stack_image_view
                                                      identifier: ring_cargo_van
                                                      items:
                                                        - type: shape
                                                          shape:
                                                            type: ellipse
                                                            aspect_ratio: 1
                                                            color: { default: { hex: "#FFFFFF", alpha: 1 } }
                                                            border:
                                                              stroke_width: 2
                                                              stroke_color: { default: { hex: "#CCCCCC", alpha: 1 } }
                                                            scale: 1
                                                  - size: { width: 10, height: 10 }
                                                    position: { horizontal: center, vertical: center }
                                                    view:
                                                      type: stack_image_view
                                                      identifier: dot_cargo_van
                                                      visibility:
                                                        default: false
                                                        invert_when_state_matches:
                                                          key: selected_truck
                                                          value: { equals: cargo_van }
                                                      items:
                                                        - type: shape
                                                          shape:
                                                            type: ellipse
                                                            aspect_ratio: 1
                                                            color: { default: { hex: "#F26722", alpha: 1 } }
                                                            scale: 1
                                            - size: { width: 100%, height: auto }
                                              view:
                                                type: label
                                                text: "Cargo Van"
                                                text_appearance:
                                                  font_size: 14
                                                  styles: [bold]
                                                  color: { default: { hex: "#1A1A1A", alpha: 1 } }
                                                  alignment: start
                                            - size: { width: auto, height: auto }
                                              margin: { start: 6 }
                                              view:
                                                type: label
                                                text: " Recommended "
                                                text_appearance:
                                                  font_size: 11
                                                  styles: [bold]
                                                  color: { default: { hex: "#FFFFFF", alpha: 1 } }
                                                  alignment: center
                                                background_color: { default: { hex: "#F26722", alpha: 1 } }
                                                border: { radius: 4 }
                                                visibility:
                                                  default: false
                                                  invert_when_state_matches:
                                                    and:
                                                      - scope: [$forms, current, data, children, move_description, status, ai, status]
                                                        value: { equals: complete }
                                                      - scope: [$forms, current, data, children, move_description, status, ai, result, vehicle]
                                                        value: { equals: cargo_van }

                              - size: { width: 100%, height: auto }
                                margin: { bottom: 6 }
                                view:
                                  type: radio_input_toggle_layout
                                  identifier: radio_toggle_10ft
                                  reporting_value: 10ft
                                  on_toggle_on:
                                    state_actions:
                                      - { type: set, key: selected_truck, value: 10ft }
                                  on_toggle_off:
                                    state_actions: []
                                  view:
                                    type: linear_layout
                                    direction: horizontal
                                    border:
                                      stroke_width: 1
                                      stroke_color: { default: { hex: "#DDDDDD", alpha: 1 } }
                                      radius: 10
                                    view_overrides:
                                      background_color:
                                        - when_state_matches:
                                            key: selected_truck
                                            value: { equals: 10ft }
                                          value: { default: { hex: "#FFF3EC", alpha: 1 } }
                                    items:
                                      - size: { width: 100%, height: auto }
                                        margin: { top: 12, bottom: 12, start: 16, end: 12 }
                                        view:
                                          type: linear_layout
                                          direction: horizontal
                                          items:
                                            - size: { width: 20, height: 20 }
                                              margin: { end: 12 }
                                              view:
                                                type: container
                                                items:
                                                  - size: { width: 20, height: 20 }
                                                    position: { horizontal: center, vertical: center }
                                                    view:
                                                      type: stack_image_view
                                                      identifier: ring_10ft
                                                      items:
                                                        - type: shape
                                                          shape:
                                                            type: ellipse
                                                            aspect_ratio: 1
                                                            color: { default: { hex: "#FFFFFF", alpha: 1 } }
                                                            border:
                                                              stroke_width: 2
                                                              stroke_color: { default: { hex: "#CCCCCC", alpha: 1 } }
                                                            scale: 1
                                                  - size: { width: 10, height: 10 }
                                                    position: { horizontal: center, vertical: center }
                                                    view:
                                                      type: stack_image_view
                                                      identifier: dot_10ft
                                                      visibility:
                                                        default: false
                                                        invert_when_state_matches:
                                                          key: selected_truck
                                                          value: { equals: 10ft }
                                                      items:
                                                        - type: shape
                                                          shape:
                                                            type: ellipse
                                                            aspect_ratio: 1
                                                            color: { default: { hex: "#F26722", alpha: 1 } }
                                                            scale: 1
                                            - size: { width: 100%, height: auto }
                                              view:
                                                type: label
                                                text: "10 ft Truck"
                                                text_appearance:
                                                  font_size: 14
                                                  styles: [bold]
                                                  color: { default: { hex: "#1A1A1A", alpha: 1 } }
                                                  alignment: start
                                            - size: { width: auto, height: auto }
                                              margin: { start: 6 }
                                              view:
                                                type: label
                                                text: " Recommended "
                                                text_appearance:
                                                  font_size: 11
                                                  styles: [bold]
                                                  color: { default: { hex: "#FFFFFF", alpha: 1 } }
                                                  alignment: center
                                                background_color: { default: { hex: "#F26722", alpha: 1 } }
                                                border: { radius: 4 }
                                                visibility:
                                                  default: false
                                                  invert_when_state_matches:
                                                    and:
                                                      - scope: [$forms, current, data, children, move_description, status, ai, status]
                                                        value: { equals: complete }
                                                      - scope: [$forms, current, data, children, move_description, status, ai, result, vehicle]
                                                        value: { equals: 10ft }

                              - size: { width: 100%, height: auto }
                                margin: { bottom: 6 }
                                view:
                                  type: radio_input_toggle_layout
                                  identifier: radio_toggle_15ft
                                  reporting_value: 15ft
                                  on_toggle_on:
                                    state_actions:
                                      - { type: set, key: selected_truck, value: 15ft }
                                  on_toggle_off:
                                    state_actions: []
                                  view:
                                    type: linear_layout
                                    direction: horizontal
                                    border:
                                      stroke_width: 1
                                      stroke_color: { default: { hex: "#DDDDDD", alpha: 1 } }
                                      radius: 10
                                    view_overrides:
                                      background_color:
                                        - when_state_matches:
                                            key: selected_truck
                                            value: { equals: 15ft }
                                          value: { default: { hex: "#FFF3EC", alpha: 1 } }
                                    items:
                                      - size: { width: 100%, height: auto }
                                        margin: { top: 12, bottom: 12, start: 16, end: 12 }
                                        view:
                                          type: linear_layout
                                          direction: horizontal
                                          items:
                                            - size: { width: 20, height: 20 }
                                              margin: { end: 12 }
                                              view:
                                                type: container
                                                items:
                                                  - size: { width: 20, height: 20 }
                                                    position: { horizontal: center, vertical: center }
                                                    view:
                                                      type: stack_image_view
                                                      identifier: ring_15ft
                                                      items:
                                                        - type: shape
                                                          shape:
                                                            type: ellipse
                                                            aspect_ratio: 1
                                                            color: { default: { hex: "#FFFFFF", alpha: 1 } }
                                                            border:
                                                              stroke_width: 2
                                                              stroke_color: { default: { hex: "#CCCCCC", alpha: 1 } }
                                                            scale: 1
                                                  - size: { width: 10, height: 10 }
                                                    position: { horizontal: center, vertical: center }
                                                    view:
                                                      type: stack_image_view
                                                      identifier: dot_15ft
                                                      visibility:
                                                        default: false
                                                        invert_when_state_matches:
                                                          key: selected_truck
                                                          value: { equals: 15ft }
                                                      items:
                                                        - type: shape
                                                          shape:
                                                            type: ellipse
                                                            aspect_ratio: 1
                                                            color: { default: { hex: "#F26722", alpha: 1 } }
                                                            scale: 1
                                            - size: { width: 100%, height: auto }
                                              view:
                                                type: label
                                                text: "15 ft Truck"
                                                text_appearance:
                                                  font_size: 14
                                                  styles: [bold]
                                                  color: { default: { hex: "#1A1A1A", alpha: 1 } }
                                                  alignment: start
                                            - size: { width: auto, height: auto }
                                              margin: { start: 6 }
                                              view:
                                                type: label
                                                text: " Recommended "
                                                text_appearance:
                                                  font_size: 11
                                                  styles: [bold]
                                                  color: { default: { hex: "#FFFFFF", alpha: 1 } }
                                                  alignment: center
                                                background_color: { default: { hex: "#F26722", alpha: 1 } }
                                                border: { radius: 4 }
                                                visibility:
                                                  default: false
                                                  invert_when_state_matches:
                                                    and:
                                                      - scope: [$forms, current, data, children, move_description, status, ai, status]
                                                        value: { equals: complete }
                                                      - scope: [$forms, current, data, children, move_description, status, ai, result, vehicle]
                                                        value: { equals: 15ft }

                              - size: { width: 100%, height: auto }
                                margin: { bottom: 6 }
                                view:
                                  type: radio_input_toggle_layout
                                  identifier: radio_toggle_20ft
                                  reporting_value: 20ft
                                  on_toggle_on:
                                    state_actions:
                                      - { type: set, key: selected_truck, value: 20ft }
                                  on_toggle_off:
                                    state_actions: []
                                  view:
                                    type: linear_layout
                                    direction: horizontal
                                    border:
                                      stroke_width: 1
                                      stroke_color: { default: { hex: "#DDDDDD", alpha: 1 } }
                                      radius: 10
                                    view_overrides:
                                      background_color:
                                        - when_state_matches:
                                            key: selected_truck
                                            value: { equals: 20ft }
                                          value: { default: { hex: "#FFF3EC", alpha: 1 } }
                                    items:
                                      - size: { width: 100%, height: auto }
                                        margin: { top: 12, bottom: 12, start: 16, end: 12 }
                                        view:
                                          type: linear_layout
                                          direction: horizontal
                                          items:
                                            - size: { width: 20, height: 20 }
                                              margin: { end: 12 }
                                              view:
                                                type: container
                                                items:
                                                  - size: { width: 20, height: 20 }
                                                    position: { horizontal: center, vertical: center }
                                                    view:
                                                      type: stack_image_view
                                                      identifier: ring_20ft
                                                      items:
                                                        - type: shape
                                                          shape:
                                                            type: ellipse
                                                            aspect_ratio: 1
                                                            color: { default: { hex: "#FFFFFF", alpha: 1 } }
                                                            border:
                                                              stroke_width: 2
                                                              stroke_color: { default: { hex: "#CCCCCC", alpha: 1 } }
                                                            scale: 1
                                                  - size: { width: 10, height: 10 }
                                                    position: { horizontal: center, vertical: center }
                                                    view:
                                                      type: stack_image_view
                                                      identifier: dot_20ft
                                                      visibility:
                                                        default: false
                                                        invert_when_state_matches:
                                                          key: selected_truck
                                                          value: { equals: 20ft }
                                                      items:
                                                        - type: shape
                                                          shape:
                                                            type: ellipse
                                                            aspect_ratio: 1
                                                            color: { default: { hex: "#F26722", alpha: 1 } }
